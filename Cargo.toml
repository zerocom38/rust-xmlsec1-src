[package]
name = "xmlsec1-src"
# <crate version>+<bundled xmlsec version>
version = "1.0.0+1.3.13"
authors = ["Stefan Sommerfeld <stefan.sommerfeld@gmail.com>"]
edition = "2024"
readme = "README.md"
license = "MIT"
description = "Source of xmlsec1 and logic to build it, for use by the xmlsec crate's vendored feature"
homepage = "https://github.com/zerocom38/rust-xmlsec"
repository = "https://github.com/zerocom38/rust-xmlsec"
keywords = ["xml", "xmlsec", "dsig", "vendored"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/COPYING",
    "/src/**",
    "/xmlsec/COPYING",
    "/xmlsec/Copyright",
    "/xmlsec/configure.ac",
    "/xmlsec/include/xmlsec/*.h",
    "/xmlsec/include/xmlsec/version.h.in",
    "/xmlsec/include/xmlsec/openssl/*.h",
    "/xmlsec/src/*.c",
    "/xmlsec/src/*.h",
    "/xmlsec/src/openssl/*.c",
    "/xmlsec/src/openssl/*.h",
]

[dependencies]
cc = "1.10.0"
pkg-config = "0.3.34"
vcpkg = "0.2.15"

[workspace]
members = ["testcrate"]
